projeto: "Compilador Amanda"
versao: "0.1.0"
titulo: "Exemplo Amanda"
autor: "amandac"
pdf:
  caminho: "examples/exemplo.txt"
  idioma: "pt-BR"
chunking:
  tamanho_max: 180
  sobreposicao: 30
embeddings:
  modelo: "hash-tfidf-384"
  dimensao: 384
question_gen:
  max_choice: 3
  max_score: 2
  max_noul: 5
extracao:
  tj_espaco: -100.0
  tj_salto: 500.0
decision_engine:
  modelo: "retrieval-hibrido"
  limiar_confianca: 0.7
  limiar_recusa: 0.3
  # conf_center: 0.10  # zero = padrao 0.12
  # conf_slope: 22.0   # zero = padrao 12.0
templates:
  dir: "templates"
servidor:
  porta: 8080
  host: "127.0.0.1"
  pacote: "build/exemplo.amanda"  # usado pelo serve sem --package (flag prevalece)
  # cors: "*"
  # api_key_file: "chave.txt"  # flag --api-key / env AMANDA_API_KEY prevalecem
  # max_body: 1048576
  # max_conns: 16
  # workers: 8
  # eval_max: 200
  # backend: "local"  # ou laya-http
  # laya_url: "http://127.0.0.1:8420"
  # laya_max: 2
  # laya_queue: 16  # teto de esperas LLM (0 = sem espera)
  # laya_queue_ms: 5000  # espera maxima (0 = tenta uma vez)
