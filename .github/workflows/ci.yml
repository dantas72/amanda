name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Fase 14 (2026-10-02): macOS de volta nas 2 arquiteturas
        # hosted gratuitas — ARM64 M1 (macos-15) + x86_64 Intel
        # (macos-15-intel). M2 so em larger pagos (labels
        # -xlarge exigem runner da org; nao resolvem aqui) e M3/M4
        # nao existem como labels — essas maquinas entram via
        # self-hosted (ver README). Auditoria de portabilidade:
        # sem intrinsecos x86, LE byte-a-byte, SIGPIPE portatil,
        # stack das threads (~70KB) dentro dos 512KB do macOS.
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Integration (compile/inspect/ask)
        shell: bash
        run: |
          BIN=build/amandac
          [ -x "$BIN" ] || BIN=build/Release/amandac
          [ -x "$BIN" ] || BIN=build/amandac.exe
          [ -x "$BIN" ] || BIN=build/Release/amandac.exe
          echo "BIN=$BIN"
          "$BIN" version
          "$BIN" compile --input examples/exemplo.txt --output /tmp/exemplo.amanda --title "Exemplo Amanda"
          "$BIN" compile --config examples/config.yaml --output /tmp/exemplo_cfg.amanda
          "$BIN" inspect --package /tmp/exemplo_cfg.amanda --stats
          "$BIN" inspect --package /tmp/exemplo.amanda --stats
          "$BIN" ask --package /tmp/exemplo.amanda "O que e entropia?"
          "$BIN" inspect --package /tmp/exemplo.amanda --json | grep -q '"chunks"'
          echo "AMANDAC_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Eval (Fase 5 - calibracao)
        shell: bash
        run: |
          "$AMANDAC_BIN" eval --package /tmp/exemplo.amanda --sample 1.0

      - name: Calibrate (Fase 6)
        shell: bash
        run: |
          "$AMANDAC_BIN" calibrate --package /tmp/exemplo.amanda --sample 1.0

      - name: Serve smoke (OpenAI-compatible)
        shell: bash
        run: |
          "$AMANDAC_BIN" serve --package /tmp/exemplo.amanda --port 18080 --conf-center 0.12 --conf-slope 12 --limiar-recusa 0.3 &
          SRV=$!
          sleep 3
          curl -fsS --max-time 10 http://127.0.0.1:18080/v1/models
          curl -fsS --max-time 10 -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"amanda","messages":[{"role":"user","content":"O que e entropia?"}]}'
          curl -fsS --max-time 10 -X POST http://127.0.0.1:18080/v1/decisions \
            -H 'Content-Type: application/json' \
            -d '{"pergunta":"Qual e a capital do Brasil?"}'
          curl -fsS --max-time 10 -X POST http://127.0.0.1:18080/v1/embeddings \
            -H 'Content-Type: application/json' \
            -d @examples/smoke_embeddings.json | grep -o '"total_tokens":[0-9]*'
          curl -fsS --max-time 10 -N -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d @examples/smoke_stream.json | grep -q 'data: \[DONE\]'
          curl -fsS --max-time 20 -X POST http://127.0.0.1:18080/v1/eval \
            -H 'Content-Type: application/json' \
            -d @examples/smoke_eval.json | grep -q '"cobertura"'
          kill $SRV

      - name: Laya check (optional, never fails)
        shell: bash
        run: sh scripts/check_laya.sh || true

      - name: Laya LLM backend check (Fase 3, optional, never fails)
        shell: bash
        run: sh scripts/check_laya_llm.sh || true

      - name: Release artifacts (Fase 7.6)
        uses: actions/upload-artifact@v4
        with:
          name: amandac-${{ matrix.os }}
          path: |
            build/amandac
            build/amanda_tests
            build/Release/amandac.exe
            build/Release/amanda_tests.exe
